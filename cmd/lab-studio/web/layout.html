{{define "layout"}}
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RAP-LAB</title><link rel="stylesheet" href="/static/brand.css"><link rel="stylesheet" href="/static/site.css"></head>
<body>
<header>
  <a class="brand" href="/"><img src="/static/img/krone.jpg" alt="RAP-LAB Startseite"></a>
  <nav>
    <a href="/studio">LAB-STUDIO</a>
    <a href="/connect">LAB-CONNECT</a>
    {{if .LoggedIn}}
      <form method="post" action="/logout" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <button type="submit" class="nav-btn">Logout</button>
      </form>
    {{else}}
      <a href="/login">Anmelden</a>
    {{end}}
  </nav>
</header>
<main>{{template "content" .}}</main>
</body>
</html>
{{end}}
