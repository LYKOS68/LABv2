# Prompt-Gruppe: <gruppenname>          z. B. sitzung, bauen, pruefen, extern
# schema: prompt-gruppe/v1
#
# Vorlage. Für eine neue Gruppe diese Datei kopieren als hub/user/prompts-<gruppenname>.yaml,
# <gruppenname> und XXXX ersetzen. Die Vorlage selbst bleibt leer.
#
# APPEND-ONLY-REGELN
# 1. Ein Eintrag mit ausgefülltem `text` wird nie geändert und nie gelöscht.
# 2. Ändern = neuen Eintrag ans Ende anhängen: gleiche `id`, `version` + 1,
#    `supersedes: <id>@<alte version>`.
# 3. Gültig ist immer die höchste `version` einer `id`.
# 4. Abschalten = neue Version mit `retired: true` und leerem `text`.
# 5. Eine `id` wird nie für einen anderen Zweck wiederverwendet.
# 6. Neue Einträge nur am Ende der Liste, nie dazwischen.
# 7. Leere Plätze (text: "") dürfen einmalig ausgefüllt werden, danach gilt Regel 1.
#
# FELDER
#   id          P-<GRUPPE>-<nn>, z. B. P-SITZ-01
#   version     1, 2, 3 ...
#   supersedes  "" oder <id>@<version>
#   retired     false | true
#   title       kurzer Name
#   when        wann du ihn einsetzt
#   tool        claude-cli | agy | opencode | chatgpt | manus (mehrere mit Komma)
#   text        der Prompt zum Kopieren, ca. 150 Wörter, verweist auf Regeldateien statt sie abzuschreiben

prompts:
  - id: P-XXXX-01
    version: 1
    supersedes: ""
    retired: false
    title: ""
    when: ""
    tool: ""
    text: ""

